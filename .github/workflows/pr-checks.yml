name: Pull request tests
on:
  pull_request:
    branches: [beta, main]
permissions:
  contents: read
concurrency:
  group: cts-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-tests:
    name: CTS build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
