name: Reconcile verified beta D1 migrations (beta only)
on:
  push:
    branches: [beta]
    paths: [.github/workflows/beta-d1-reconcile.yml]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.ref == 'refs/heads/beta'
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify schema and reconcile only beta history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CTS_BETA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '119b0919229edb3185b69f1c6bd04b66'
        run: node tools/reconcile-beta-migration-history.mjs
