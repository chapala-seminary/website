name: Diagnose production verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - tools/check-production-release.mjs
      - .github/workflows/production-verifier.yml
permissions:
  contents: read
jobs:
  probe:
    name: Public production verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the published main release from this runner
        env:
          CTS_PUBLISHED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { checkProduction } from './tools/check-production-release.mjs';
          const sha = execFileSync('git', ['rev-parse', '--short', process.env.CTS_PUBLISHED_SHA], { encoding: 'utf8' }).trim();
          const response = await fetch(`https://chapalaseminary.org/version.txt?diagnose=${sha}`, { signal: AbortSignal.timeout(10000) });
          assert.equal(response.status, 200);
          const stamp = (await response.text()).trim();
          assert.match(stamp, /^\d{4}-\d{2}-\d{2} [0-9a-f]+$/);
          assert.ok(stamp.endsWith(` ${sha}`), 'Published release must match the main commit being diagnosed.');
          writeFileSync('/tmp/cts-published-stamp', stamp);
          await checkProduction(stamp);
          JS
      - name: Compare the public health response with curl after a probe failure
        if: failure()
        run: |
          test -f /tmp/cts-published-stamp || exit 0
          CTS_STAMP=$(cat /tmp/cts-published-stamp)
          curl --silent --show-error --max-time 15 --get --data-urlencode "release=${CTS_STAMP}" \
            --dump-header /tmp/cts-health-headers --output /tmp/cts-health-body \
            --write-out 'curl HTTP %{http_code}\n' https://chapalaseminary.org/api/health
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          console.log(readFileSync('/tmp/cts-health-headers', 'utf8').split('\n').filter(line => /^(HTTP\/|cf-mitigated:|cf-ray:|server:|content-type:)/i.test(line)).join('\n'));
          const body = readFileSync('/tmp/cts-health-body', 'utf8');
          try { console.log(JSON.stringify({ ok: JSON.parse(body).ok })); }
          catch { console.log(body.slice(0, 200)); }
          JS
