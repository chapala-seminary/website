name: OT Survey source-verified publisher PDF acquisition (one-time)
on:
  push:
    branches:
      - ai/ot-survey-books-20261030
permissions:
  contents: write
jobs:
  acquire-originals:
    if: github.repository == 'chapala-seminary/website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download intact publisher-original files and verify exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/textbooks
          fetch_pdf () {
            local url="$1" target="$2" expected="$3"
            if test -f "$target"; then
              echo "$expected  $target" | sha256sum --check --status
              return
            fi
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 --silent --show-error "$url" -o "$target.tmp"
            test "$(head -c 5 "$target.tmp")" = '%PDF-'
            echo "$expected  $target.tmp" | sha256sum --check
            mv "$target.tmp" "$target"
          }
          fetch_pdf 'https://shepherdsglobal.org/files/english/EXOT-2E-en.pdf' 'public/textbooks/ot-survey-mcelwain-2025-en.pdf' '846c228833bc2deb0670c8c7c60d7e0742ffacf90e3f2ff06a5d51005ce8bbfc'
          fetch_pdf 'https://cdn.shepherdsglobal.org/courses/spanish/EXOT-2E-es.pdf' 'public/textbooks/ot-survey-mcelwain-2025-es.pdf' '967095b6aa3db782805681f6243db447324f2787f998dca37f1ee29d3c0ba547'
          fetch_pdf 'https://www.freebiblecommentary.org/pdf/fre/OTSURVEY_french.pdf' 'public/textbooks/ot-survey-utley-2014-fr.pdf' 'f10b4117e2feadfd1fa7ce3742212dc67b7b2bd5c62007278fad8c234be19f07'
          fetch_pdf 'https://villageministries.org/wp-content/uploads/2015/05/Foundations-Swahiliforwebsite.pdf' 'public/textbooks/ot-survey-vmi-2001-sw.pdf' 'c6e736148cc2436eb9eaa4b6cbaa5019f911651a87b222bbdc691166d1b9954e'
          git add public/textbooks/ot-survey-*.pdf
          if ! git diff --staged --quiet; then
            git config user.name "CTS source-verification bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive unchanged publisher PDFs for beta-only OT Survey review"
            git push
          fi
