# Church History original research files; keep off beta/main, read from official publisher.
name: Preserve original Church History publisher PDFs in research branch
on:
  push:
    branches:
      - ai/nt-modern-pdf-faculty-acquisition-20261031
    paths:
      - .github/workflows/ch-faculty-pdf-preserve.yml
permissions:
  contents: write
jobs:
  preserve:
    if: github.ref == 'refs/heads/ai/nt-modern-pdf-faculty-acquisition-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Acquire complete originals to research-only branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p faculty-research/original-publisher-pdfs
          for entry in 'CH1-2E-en.pdf:121' 'CH2-2E-en.pdf:125'; do
            file="${entry%%:*}"; pages="${entry#*:}"
            curl --fail --location --silent --show-error --retry 3 --max-time 180 "https://shepherdsglobal.org/files/english/$file" -o "faculty-research/original-publisher-pdfs/$file"
            test "$(head -c5 "faculty-research/original-publisher-pdfs/$file")" = '%PDF-'
            sudo apt-get install -y -qq poppler-utils >/dev/null
            test "$(pdfinfo "faculty-research/original-publisher-pdfs/$file" | awk '/^Pages:/ {print $2}')" = "$pages"
          done
          sha256sum faculty-research/original-publisher-pdfs/*.pdf > faculty-research/original-publisher-pdfs/SHA256SUMS.txt
          cat > faculty-research/original-publisher-pdfs/README.md <<'EOF'
          # Faculty research only — complete untouched publisher originals
          Official sources: https://shepherdsglobal.org/files/english/CH1-2E-en.pdf and https://shepherdsglobal.org/files/english/CH2-2E-en.pdf
          These are the complete, unaltered original 2019 second-edition PDFs, kept on a research branch, not adopted/linked to students.
          Their publisher permits whole unaltered free distribution; no changes/for-profit sale/translation without permission.
          No CTS quizzes, lessons, assessments, records or course approvals are changed by this archival action.
          EOF
          git config user.name 'chapalatheological-ai'
          git config user.email 'chapalatheological@gmail.com'
          git add faculty-research/original-publisher-pdfs
          git diff --cached --quiet && exit 0
          git commit -m 'research: preserve original Church History PDFs with source hashes'
          git push origin HEAD:refs/heads/ai/nt-modern-pdf-faculty-acquisition-20261031
