# SonarQube code-health settings for chapalaseminary.org.
# Read by the SonarQube Cloud GitHub Action (.github/workflows/sonar.yml) and by a
# local SonarQube Community Build scan (docs/code-health-sonarqube.md).
#
# Scope: the code that runs the site — Astro pages, the Worker, browser scripts,
# build/verification tools and the test suite. Course content (lesson HTML,
# question JSON, readings, Markdown, review drafts) is data, not code, and is
# left out so the report stays about code quality.

sonar.projectKey=chapala-seminary_website
sonar.organization=chapala-seminary
sonar.projectName=CTS website

sonar.sourceEncoding=UTF-8

# Production code.
sonar.sources=src,worker,tools,public/assets,astro.config.mjs
# Test code (reported separately; test files aren't held to production rules).
sonar.tests=test

# Left out of everything:
#   - course content and generated data (HTML bodies, JSON banks, Markdown)
#   - third-party/minified/generated assets (jsPDF, the 350 KB emblem script,
#     and the generated fill-in question data in public/assets/js/fill/)
#   - private answer keys, which must never leave the machine. They are also
#     git-ignored, and the scanner skips git-ignored files, but say it twice.
sonar.exclusions=\
  **/*.json,\
  **/*.html,\
  **/*.md,\
  **/*.docx,\
  **/*.pdf,\
  **/*.txt,\
  **/*.zip,\
  src/content/**,\
  src/body/**,\
  public/assets/vendor/**,\
  public/cts-emblem.js,\
  public/assets/js/fill/**,\
  **/*.min.js,\
  .assessment-keys/**,\
  tools/_work/**,\
  tools/_reports/**,\
  dist/**,\
  dist-shadow/**,\
  .astro/**,\
  .wrangler/**,\
  .wrangler-local/**,\
  node_modules/**

sonar.test.inclusions=test/**/*.mjs,test/**/*.js,test/**/*.ts,test/**/*.sh
sonar.test.exclusions=**/*.json,**/*.html,test/.wrangler/**

# Coverage is not measured. The suite is plain Node scripts and browser tests
# against the built Worker (test/run-tests.sh, e2e/), and none of it writes a
# coverage report. Without one, Sonar reads every new line as untested and the
# "Coverage on New Code" condition fails on any PR that adds more than a few
# lines. Leaving all files out of coverage makes the report say "not measured"
# instead of "0%". Remove this line if a coverage report is ever added
# (sonar.javascript.lcov.reportPaths).
sonar.coverage.exclusions=**/*

# Tests repeat setup on purpose; don't count that as duplicated code.
sonar.cpd.exclusions=test/**

# Known false positives, ignored on purpose:
#   S2187 "test file contains no tests": the suite is plain Node scripts run by
#         test/run-tests.sh, not Jest/Mocha, so Sonar can't see the tests.
#   S4036 "OS command uses PATH": developer/CI tools calling git, npx and
#         wrangler from PATH. These never run on the live site.
sonar.issue.ignore.multicriteria=testsNoTests,toolsPath,testsPath
sonar.issue.ignore.multicriteria.testsNoTests.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.testsNoTests.resourceKey=test/**
sonar.issue.ignore.multicriteria.toolsPath.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.toolsPath.resourceKey=tools/**
sonar.issue.ignore.multicriteria.testsPath.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.testsPath.resourceKey=test/**
